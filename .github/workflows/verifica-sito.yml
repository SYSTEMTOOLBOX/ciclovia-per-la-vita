name: Controllo statico sito e privacy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica link, moduli, privacy e video
        run: node scripts/verify-site.cjs
