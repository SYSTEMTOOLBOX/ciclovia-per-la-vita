name: Controllo statico sito e privacy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Collaudo launcher con Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows-launcher.ps1
      - name: Backup sintetico senza credenziali reali
        run: node --test tests/windows-backup.test.cjs
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verifica link, moduli, privacy e video
        run: node scripts/verify-site.cjs
      - name: Test modulo, contatore e cifratura
        run: npm test
      - name: Authentication, regole e ripristino su emulatori isolati
        run: npm run test:rules
