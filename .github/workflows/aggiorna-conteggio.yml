name: Aggiorna totale anonimo delle adesioni

on:
  workflow_dispatch:
    inputs:
      test_connection:
        description: "Verifica Firebase senza aprire la raccolta e senza pubblicare il totale"
        type: boolean
        default: true
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: counter-adesioni
  cancel-in-progress: false

jobs:
  count:
    if: github.repository == 'SYSTEMTOOLBOX/ciclovia-per-la-vita'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica se e disponibile il conteggio
        id: ready
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CONNECTION_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_connection == true && '1' || '0' }}
        run: |
          if [ "$CONNECTION_TEST" = "1" ] && [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Test fallito: credenziale Firebase mancante."
            exit 1
          fi
          if grep -q "export const launchEnabled = true;" firebase-config.js && [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Contatore attivo senza credenziale."
            exit 1
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] && { grep -q "export const launchEnabled = true;" firebase-config.js || [ "$CONNECTION_TEST" = "1" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Raccolta chiusa oppure credenziale non configurata."
          fi
      - name: Installa SDK senza accesso alle credenziali
        if: steps.ready.outputs.enabled == 'true'
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Calcola totale senza esportare dati personali
        if: steps.ready.outputs.enabled == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CICLOVIA_CONNECTION_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_connection == true && '1' || '0' }}
        run: node scripts/update-adesioni-count.cjs
      - name: Pubblica soltanto il totale
        if: steps.ready.outputs.enabled == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.test_connection == true)
        run: |
          if git diff --quiet -- adesioni-count.json; then
            echo "Nessun aggiornamento da pubblicare."
            exit 0
          fi
          git config user.name "ciclovia-count-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- adesioni-count.json
          git commit -m "Aggiorna conteggio pubblico aggregato"
          git push origin HEAD:main
